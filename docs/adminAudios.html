<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Música</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="admin-container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
            <button onclick="window.location.href='adminUsers.html'" class="btn-icon" title="Volver"><i class="fas fa-arrow-left"></i></button>
            <div style="text-align: right;">
                <h2 style="font-weight: 700; font-size: 1.5rem; color: var(--text-main);">Biblioteca de Usuario</h2>
                <p id="target-username-display" style="color: var(--text-muted); font-size: 0.9rem;">Cargando...</p>
            </div>
        </header>

        <section class="song-management">
            <!-- Drag & Drop Zone strictly for uploading -->
            <div class="upload-zone" id="drop-zone">
                <i class="fas fa-cloud-upload-alt" style="font-size: 4rem; color: var(--accent-color); margin-bottom: 1.5rem;"></i>
                <h3 style="font-size: 1.25rem; margin-bottom: 0.5rem;">Sube nuevas canciones</h3>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Arrastra y suelta tus archivos de audio aquí</p>
                <div id="upload-status" style="font-size: 0.9rem; font-weight: 600; color: var(--accent-color); height: 1.2rem;"></div>
                <input type="file" id="file-input" multiple accept="audio/*" style="display: none;">
            </div>

            <div class="song-list-admin" id="admin-song-list">
                <!-- Dinámico -->
            </div>
        </section>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetUserId = urlParams.get('userId');
        const dropZone = document.getElementById('drop-zone');
        const status = document.getElementById('upload-status');

        document.addEventListener('DOMContentLoaded', async () => {
            const currentUser = checkAuth();
            if (currentUser.role !== 'Admin') {
                window.location.href = 'index.html';
                return;
            }

            // Get target username
            const { data: userData } = await window.supabaseClient.from('users').select('username').eq('id', targetUserId).single();
            if (userData) {
                document.getElementById('target-username-display').textContent = `Gestionando música de: ${userData.username}`;
            }

            loadUserSongs();
        });

        // Drag & Drop events
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        // Optional: click to upload but keeping it hidden behind dropZone
        dropZone.onclick = () => document.getElementById('file-input').click();
        document.getElementById('file-input').onchange = (e) => {
            handleFiles(e.target.files);
        };

        async function handleFiles(files) {
            for (let file of files) {
                let nameOnly = file.name.replace(/\.[^/.]+$/, "");
                let title = nameOnly;
                let artist = 'Desconocido';

                if (nameOnly.includes(' - ')) {
                    const parts = nameOnly.split(' - ');
                    artist = parts[0].trim();
                    title = parts[1].trim();
                }

                status.textContent = `Procesando: ${title}...`;

                try {
                    const duration = await getDuration(file);
                    status.textContent = `Subiendo: ${title}...`;

                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', 'ml_default');

                    const cloudName = 'dp776nphp';
                    const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, {
                        method: 'POST',
                        body: formData
                    });

                    const cloudData = await response.json();
                    if (cloudData.error) throw new Error(cloudData.error.message);

                    const audioUrl = cloudData.secure_url;

                    const { error } = await window.supabaseClient
                        .from('songs')
                        .insert([{
                            title: title,
                            artist: artist,
                            audio_url: audioUrl,
                            duration: duration,
                            user_id: targetUserId
                        }]);

                    if (error) throw error;

                    status.textContent = `¡${title} subida con éxito!`;
                    setTimeout(() => { status.textContent = ''; }, 3000);
                    loadUserSongs();
                } catch (err) {
                    status.textContent = `Error: ${err.message}`;
                    console.error(err);
                }
            }
        }

        function getDuration(file) {
            return new Promise((resolve) => {
                const audio = document.createElement('audio');
                audio.src = URL.createObjectURL(file);
                audio.onloadedmetadata = () => {
                    const min = Math.floor(audio.duration / 60);
                    const sec = Math.floor(audio.duration % 60);
                    resolve(`${min}:${sec < 10 ? '0' : ''}${sec}`);
                };
                audio.onerror = () => resolve('--:--');
            });
        }

        async function loadUserSongs() {
            const { data, error } = await window.supabaseClient
                .from('songs')
                .select('*')
                .eq('user_id', targetUserId)
                .order('id', { ascending: false });

            if (error) return;

            const listContainer = document.getElementById('admin-song-list');
            listContainer.innerHTML = '';

            data.forEach(song => {
                const card = document.createElement('div');
                card.className = 'user-card';
                card.style.padding = '1rem 1.5rem';
                card.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <i class="fas fa-music" style="color: var(--accent-color);"></i>
                        <div>
                            <h4 style="font-size: 0.95rem; margin: 0;">${song.title}</h4>
                            <p style="font-size: 0.8rem; color: var(--text-muted); margin: 0;">${song.artist} • ${song.duration}</p>
                        </div>
                    </div>
                    <button onclick="deleteSong(${song.id})" class="btn-delete" title="Eliminar Canción">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                `;
                listContainer.appendChild(card);
            });
        }

        async function deleteSong(id) {
            if (!confirm('¿Eliminar esta canción definitivamente?')) return;
            const { error } = await window.supabaseClient.from('songs').delete().eq('id', id);
            loadUserSongs();
        }
    </script>
</body>
</html>
