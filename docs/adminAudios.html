<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Música</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="admin-container" style="padding-top: 1rem;">
        <!-- Botón Volver -->
        <button onclick="window.location.href='adminUsers.html'" class="btn-icon" style="position: absolute; top: 1rem; left: 1rem;"><i class="fas fa-arrow-left"></i></button>

        <section class="song-management">
            <div class="upload-zone" id="drop-zone">
                <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: var(--accent-color);"></i>
                <p>Arrastra tus canciones aquí</p>
                <input type="file" id="file-input" multiple accept="audio/*" style="display: none;">
                <button onclick="document.getElementById('file-input').click()" class="btn-primary" style="width: auto; margin-top: 1rem;">O selecciona archivos</button>
            </div>

            <div id="upload-status" style="margin-top: 1rem; font-size: 0.9rem;"></div>

            <div class="user-list-container" style="margin-top: 2rem;">
                <table style="background: transparent; box-shadow: none;">
                    <tbody id="song-list-body">
                        <!-- Dinámico -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <style>
        .upload-zone {
            border: 3px dashed var(--pastel-blue);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            background: white;
            transition: all 0.3s;
            cursor: pointer;
        }
        .upload-zone.dragover {
            background: var(--pastel-green);
            border-color: var(--accent-color);
            transform: scale(1.02);
        }
        .song-row-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: white;
            border-radius: 12px;
            margin-bottom: 0.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
    </style>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetUserId = urlParams.get('userId');
        const dropZone = document.getElementById('drop-zone');
        const status = document.getElementById('upload-status');

        document.addEventListener('DOMContentLoaded', async () => {
            const currentUser = checkAuth();
            if (currentUser.role !== 'Admin') {
                window.location.href = 'index.html';
                return;
            }
            loadUserSongs();
        });

        // Drag & Drop events
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        document.getElementById('file-input').onchange = (e) => {
            handleFiles(e.target.files);
        };

        async function handleFiles(files) {
            for (let file of files) {
                let nameOnly = file.name.replace(/\.[^/.]+$/, "");
                let title = nameOnly;
                let artist = 'Desconocido';

                // Intentar separar Artista - Título
                if (nameOnly.includes(' - ')) {
                    const parts = nameOnly.split(' - ');
                    artist = parts[0].trim();
                    title = parts[1].trim();
                }

                status.textContent = `Procesando: ${title}...`;

                try {
                    // Extraer duración
                    const duration = await getDuration(file);

                    status.textContent = `Subiendo a Cloudinary: ${title}...`;

                    // Cloudinary Unsigned Upload
                    // El usuario debe tener habilitado "Unsigned uploads" en settings -> upload de Cloudinary
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', 'ml_default'); // Preset común por defecto

                    const cloudName = 'dp776nphp';
                    const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, {
                        method: 'POST',
                        body: formData
                    });

                    const cloudData = await response.json();

                    if (cloudData.error) {
                        throw new Error(cloudData.error.message);
                    }

                    const audioUrl = cloudData.secure_url;

                    const { error } = await window.supabaseClient
                        .from('songs')
                        .insert([{
                            title: title,
                            artist: artist,
                            audio_url: audioUrl,
                            duration: duration,
                            user_id: targetUserId
                        }]);

                    if (error) throw error;

                    status.textContent = `Completado: ${title}`;
                    loadUserSongs();
                } catch (err) {
                    status.textContent = `Error con ${title}: ${err.message}`;
                    console.error(err);
                }
            }
        }

        function getDuration(file) {
            return new Promise((resolve) => {
                const audio = document.createElement('audio');
                audio.src = URL.createObjectURL(file);
                audio.onloadedmetadata = () => {
                    const min = Math.floor(audio.duration / 60);
                    const sec = Math.floor(audio.duration % 60);
                    resolve(`${min}:${sec < 10 ? '0' : ''}${sec}`);
                };
                audio.onerror = () => resolve('--:--');
            });
        }

        async function loadUserSongs() {
            const { data, error } = await window.supabaseClient
                .from('songs')
                .select('*')
                .eq('user_id', targetUserId);

            if (error) return;

            const tbody = document.getElementById('song-list-body');
            tbody.innerHTML = '';

            data.forEach(song => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="song-row-admin">
                        <span>${song.title}</span>
                        <button onclick="deleteSong(${song.id})" class="btn-delete" style="background: none; color: #ff6b6b; font-size: 1.2rem;"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteSong(id) {
            if (!confirm('¿Eliminar canción?')) return;
            const { error } = await window.supabaseClient
                .from('songs')
                .delete()
                .eq('id', id);
            loadUserSongs();
        }
    </script>
</body>
</html>
