<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Música</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="hub-layout">
    <header class="top-nav">
        <div class="nav-brand">
             <button onclick="window.location.href='adminUsers.html'" class="circle-btn" style="margin-right: 1rem;"><i class="fas fa-arrow-left"></i></button>
             <h1 class="brand-name" id="user-info-title" style="text-transform: capitalize;"></h1>
        </div>
        <div class="nav-actions">
            <button id="btn-import-admin" class="nav-btn" style="display: none;">Librería Admin</button>
        </div>
    </header>

    <div class="admin-hub-container">
        <section class="hub-primary">
            <div class="upload-zone" id="drop-zone" style="border: 4px dashed var(--hub-surface-light); background: var(--hub-surface); padding: 6rem; border-radius: 32px; text-align: center; cursor: pointer; transition: var(--transition);">
                <i class="fas fa-cloud-upload-alt" style="font-size: 5rem; color: var(--hub-accent); margin-bottom: 2rem;"></i>
                <h2 style="font-size: 2rem; margin-bottom: 1rem;">Arrastra aquí la música</h2>
                <p style="color: var(--hub-text-muted); font-size: 1.1rem;">Solo archivos de audio .mp3, .wav, .m4a</p>
                <div id="upload-status" style="margin-top: 2rem; font-weight: 700; color: var(--hub-accent); min-height: 1.5rem;"></div>
                <input type="file" id="file-input" multiple accept="audio/*" style="display: none;">
            </div>

            <div id="admin-song-list" class="mosaic-grid" style="margin-top: 4rem;">
                <!-- Dinámico -->
            </div>
        </section>
    </div>

    <!-- Modal Librería Admin -->
    <div id="admin-library-modal" class="modal">
        <div class="modal-card" style="width: 95%; max-width: 1000px; height: 85vh; display: flex; flex-direction: column; padding: 2rem;">
            <div class="modal-header" style="margin-bottom: 1.5rem;">
                <h3>Transferir Música</h3>
                <p style="color: var(--hub-text-muted);">Gestiona el catálogo de este usuario</p>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; background: var(--hub-bg); padding: 1rem; border-radius: 16px;">
                <div class="tab-group">
                    <button id="tab-new" class="tab-btn active">Disponibles</button>
                    <button id="tab-all" class="tab-btn">Ya las tiene</button>
                </div>
                <div id="selection-actions" style="display: flex; gap: 0.75rem;">
                    <button id="btn-select-all-visible" class="nav-btn" style="font-size: 0.85rem; border-color: var(--hub-accent);">Seleccionar Todo</button>
                    <button id="btn-deselect-all" class="nav-btn" style="font-size: 0.85rem; background: var(--hub-surface-light);">Limpiar</button>
                </div>
            </div>

            <div id="admin-library-list" style="flex: 1; overflow-y: auto; margin-bottom: 1.5rem; padding-right: 0.5rem;">
                <!-- Dinámico: Lista Estructurada -->
            </div>

            <div class="hub-modal-actions" style="padding-top: 1rem; border-top: 1px solid var(--hub-surface-light);">
                <button id="close-library" class="hub-btn secondary">Cerrar</button>
                <button id="import-selected" class="hub-btn primary">Importar Seleccionadas</button>
            </div>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetUserId = urlParams.get('userId');
        const dropZone = document.getElementById('drop-zone');
        const status = document.getElementById('upload-status');

        document.addEventListener('DOMContentLoaded', async () => {
            const currentUser = checkAuth();
            if (currentUser.role !== 'Admin') {
                window.location.href = 'index.html';
                return;
            }

            const { data: userData } = await window.supabaseClient.from('users').select('username').eq('id', targetUserId).single();
            if (userData) {
                document.getElementById('user-info-title').textContent = userData.username;
            }

            if (targetUserId != 1) {
                document.getElementById('btn-import-admin').style.display = 'inline-flex';
            }

            loadUserSongs();
        });

        // Modal Logic
        const libraryModal = document.getElementById('admin-library-modal');
        const btnImportAdmin = document.getElementById('btn-import-admin');
        const btnCloseLibrary = document.getElementById('close-library');
        const btnImportSelected = document.getElementById('import-selected');
        const btnSelectAllVisible = document.getElementById('btn-select-all-visible');
        const btnDeselectAll = document.getElementById('btn-deselect-all');
        const tabAll = document.getElementById('tab-all');
        const tabNew = document.getElementById('tab-new');

        let selectedSongs = new Set();
        let adminLibraryData = [];
        let currentFilter = 'all'; // 'all' or 'new'

        btnImportAdmin.onclick = () => {
            libraryModal.style.display = 'flex';
            loadAdminLibrary();
        };

        btnCloseLibrary.onclick = () => {
            libraryModal.style.display = 'none';
        };

        tabAll.onclick = () => {
            currentFilter = 'owned';
            tabAll.classList.add('active');
            tabNew.classList.remove('active');
            document.getElementById('selection-actions').style.display = 'none';
            renderAdminLibraryList();
        };

        tabNew.onclick = () => {
            currentFilter = 'new';
            tabNew.classList.add('active');
            tabAll.classList.remove('active');
            document.getElementById('selection-actions').style.display = 'flex';
            renderAdminLibraryList();
        };

        btnSelectAllVisible.onclick = () => {
            const checkboxes = document.querySelectorAll('.song-checkbox:not(:disabled)');
            checkboxes.forEach(cb => {
                const id = parseInt(cb.getAttribute('data-id'));
                const song = adminLibraryData.find(s => s.id === id);
                if (song) {
                    cb.checked = true;
                    selectedSongs.add(song);
                }
            });
        };

        btnDeselectAll.onclick = () => {
            const checkboxes = document.querySelectorAll('.song-checkbox');
            checkboxes.forEach(cb => cb.checked = false);
            selectedSongs.clear();
        };

        async function loadAdminLibrary() {
            const { data: adminSongs, error: adminError } = await window.supabaseClient.from('songs').select('*').eq('user_id', 1).order('title', { ascending: true });
            const { data: userSongs, error: userError } = await window.supabaseClient.from('songs').select('audio_url').eq('user_id', targetUserId);

            if (adminError) return;
            adminLibraryData = adminSongs;
            const userAudioUrls = new Set(userSongs ? userSongs.map(s => s.audio_url) : []);

            adminLibraryData.forEach(song => {
                song.isOwned = userAudioUrls.has(song.audio_url);
            });

            tabNew.click(); // Default to new
        }

        function renderAdminLibraryList() {
            const list = document.getElementById('admin-library-list');
            list.innerHTML = '';

            const filteredSongs = currentFilter === 'new'
                ? adminLibraryData.filter(s => !s.isOwned)
                : adminLibraryData.filter(s => s.isOwned);

            if (filteredSongs.length === 0) {
                list.innerHTML = `<p style="text-align: center; color: var(--hub-text-muted); padding: 3rem;">No hay canciones en esta sección.</p>`;
                return;
            }

            filteredSongs.forEach(song => {
                const item = document.createElement('div');
                item.className = 'admin-list-item' + (song.isOwned ? ' owned' : '');

                item.innerHTML = `
                    <div class="item-info">
                        <div class="item-titles">
                            <h5>${song.title}</h5>
                            <p>${song.artist}</p>
                        </div>
                    </div>
                    <div class="item-action">
                        ${!song.isOwned ? `
                            <input type="checkbox" class="song-checkbox" data-id="${song.id}"
                                ${Array.from(selectedSongs).some(s => s.id === song.id) ? 'checked' : ''}>
                        ` : '<i class="fas fa-check-circle" style="color: var(--hub-accent);"></i>'}
                    </div>
                `;

                if (!song.isOwned) {
                    item.onclick = (e) => {
                        if (e.target.tagName !== 'INPUT') {
                            const cb = item.querySelector('.song-checkbox');
                            cb.checked = !cb.checked;
                            toggleSongSelection(song, cb.checked);
                        }
                    };
                    item.querySelector('.song-checkbox').onchange = (e) => {
                        toggleSongSelection(song, e.target.checked);
                    };
                }
                list.appendChild(item);
            });
        }

        function toggleSongSelection(song, isSelected) {
            if (isSelected) selectedSongs.add(song);
            else {
                // Find and remove matching object
                for (let s of selectedSongs) {
                    if (s.id === song.id) {
                        selectedSongs.delete(s);
                        break;
                    }
                }
            }
        }

        btnImportSelected.onclick = async () => {
            if (selectedSongs.size === 0) return await window.customAlert('Selecciona al menos una canción');

            btnImportSelected.disabled = true;
            btnImportSelected.textContent = 'Importando...';

            const songsToInsert = Array.from(selectedSongs).map(s => ({
                title: s.title,
                artist: s.artist,
                audio_url: s.audio_url,
                cover_url: s.cover_url,
                duration: s.duration,
                user_id: targetUserId
            }));

            const { error } = await window.supabaseClient.from('songs').insert(songsToInsert);

            btnImportSelected.disabled = false;
            btnImportSelected.textContent = 'Importar Seleccionadas';

            if (error) {
                await window.customAlert('Error al importar: ' + error.message);
            } else {
                libraryModal.style.display = 'none';
                loadUserSongs();
            }
        };

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--hub-accent)'; dropZone.style.background = 'rgba(99, 102, 241, 0.05)'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = 'var(--hub-surface-light)'; dropZone.style.background = 'var(--hub-surface)'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--hub-surface-light)';
            dropZone.style.background = 'var(--hub-surface)';
            handleFiles(e.dataTransfer.files);
        });

        dropZone.onclick = () => document.getElementById('file-input').click();
        document.getElementById('file-input').onchange = (e) => handleFiles(e.target.files);

        async function handleFiles(files) {
            for (let file of files) {
                let nameOnly = file.name.replace(/\.[^/.]+$/, "");
                let title = nameOnly;
                let artist = 'Desconocido';

                if (nameOnly.includes(' - ')) {
                    const parts = nameOnly.split(' - ');
                    artist = parts[0].trim();
                    title = parts[1].trim();
                }

                status.textContent = `Procesando ${title}...`;

                try {
                    const duration = await getDuration(file);
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', 'vit0x7dr');

                    const response = await fetch(`https://api.cloudinary.com/v1_1/dp776nphp/video/upload`, {
                        method: 'POST',
                        body: formData
                    });

                    const cloudData = await response.json();
                    if (cloudData.error) throw new Error("Cloudinary: " + cloudData.error.message + ". ¿Configuraste el preset 'vit0x7dr' como Unsigned?");

                    const { error: supError } = await window.supabaseClient.from('songs').insert([{
                        title, artist, audio_url: cloudData.secure_url, duration, user_id: targetUserId
                    }]);

                    if (supError) throw new Error("Supabase: " + supError.message + ". Revisa las políticas RLS.");

                    status.textContent = `¡${title} listo!`;
                    loadUserSongs();
                } catch (err) {
                    status.textContent = `Error: ${err.message}`;
                }
            }
        }

        function getDuration(file) {
            return new Promise((resolve) => {
                const audio = document.createElement('audio');
                audio.src = URL.createObjectURL(file);
                audio.onloadedmetadata = () => {
                    const min = Math.floor(audio.duration / 60);
                    const sec = Math.floor(audio.duration % 60);
                    resolve(`${min}:${sec < 10 ? '0' : ''}${sec}`);
                };
                audio.onerror = () => resolve('--:--');
            });
        }

        async function loadUserSongs() {
            const { data, error } = await window.supabaseClient.from('songs').select('*').eq('user_id', targetUserId).order('id', { ascending: false });
            if (error) return;

            const list = document.getElementById('admin-song-list');
            list.innerHTML = '';

            data.forEach(song => {
                const card = document.createElement('div');
                card.className = 'song-card';
                card.innerHTML = `
                    <div class="card-meta">
                        <h5 style="font-size: 1.25rem;">${song.title}</h5>
                        <p>${song.artist} • ${song.duration}</p>
                    </div>
                    <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end;">
                        <button onclick="deleteSong(${song.id})" class="logout-pill" style="width: 44px; height: 44px;"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        async function deleteSong(id) {
            const confirmed = await window.customConfirm('¿Eliminar canción?');
            if (!confirmed) return;
            await window.supabaseClient.from('songs').delete().eq('id', id);
            loadUserSongs();
        }
    </script>
</body>
</html>
