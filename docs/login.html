<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Sonic Hub</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="hub-layout" style="display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top right, #1e293b, #0f172a);">

    <div class="modal-card" style="display: block; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);">
        <h1 class="brand-name" style="margin-bottom: 2rem; font-size: 2.5rem;">Sonic Hub</h1>

        <div id="login-form">
            <div class="hub-input">
                <input type="text" id="login-username" placeholder="Tu usuario" required>
            </div>
            <div class="hub-input" style="margin-top: -1rem;">
                <input type="password" id="login-password" placeholder="Contraseña" required>
            </div>
            <button id="btn-login" class="hub-btn primary" style="width: 100%;">Entrar</button>
            <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--hub-text-muted);">
                ¿Nuevo aquí? <a href="#" id="show-register" style="color: var(--hub-accent); font-weight: 700; text-decoration: none;">Crea una cuenta</a>
            </p>
        </div>

        <div id="register-form" style="display: none;">
            <div class="hub-input">
                <input type="text" id="reg-username" placeholder="Elige un usuario" required>
            </div>
            <div class="hub-input" style="margin-top: -1rem;">
                <input type="password" id="reg-password" placeholder="Define una contraseña" required>
            </div>
            <button id="btn-register" class="hub-btn primary" style="width: 100%;">Unirse</button>
            <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--hub-text-muted);">
                ¿Ya eres miembro? <a href="#" id="show-login" style="color: var(--hub-accent); font-weight: 700; text-decoration: none;">Inicia sesión</a>
            </p>
        </div>

        <p id="auth-error" style="color: #ef4444; font-size: 0.85rem; margin-top: 1rem; height: 1.2rem;"></p>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
