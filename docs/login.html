<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-body">
    <div class="auth-card">
        <div id="login-form">
            <div class="input-group">
                <input type="text" id="login-username" placeholder="Usuario" required>
            </div>
            <div class="input-group">
                <input type="password" id="login-password" placeholder="Contraseña" required>
            </div>
            <button id="btn-login" class="btn-primary">Iniciar Sesión</button>
            <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                ¿No tienes cuenta? <a href="#" id="show-register" style="color: var(--accent-color); font-weight: 600; text-decoration: none;">Regístrate</a>
            </p>
        </div>

        <div id="register-form" style="display: none;">
            <div class="input-group">
                <input type="text" id="reg-username" placeholder="Nuevo Usuario" required>
            </div>
            <div class="input-group">
                <input type="password" id="reg-password" placeholder="Contraseña" required>
            </div>
            <button id="btn-register" class="btn-primary">Crear Cuenta</button>
            <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                ¿Ya tienes cuenta? <a href="#" id="show-login" style="color: var(--accent-color); font-weight: 600; text-decoration: none;">Inicia Sesión</a>
            </p>
        </div>

        <p id="auth-error" style="color: #ff6b6b; font-size: 0.85rem; margin-top: 1rem; height: 1.2rem;"></p>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
