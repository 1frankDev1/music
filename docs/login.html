<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-box">

            <div id="login-form">
                <div class="input-group">
                    <input type="text" id="login-username" placeholder="Usuario" required>
                </div>
                <div class="input-group">
                    <input type="password" id="login-password" placeholder="Contraseña" required>
                </div>
                <button id="btn-login" class="btn-primary">Entrar</button>
                <p>¿No tienes cuenta? <a href="#" id="show-register">Regístrate</a></p>
            </div>

            <div id="register-form" style="display: none;">
                <div class="input-group">
                    <input type="text" id="reg-username" placeholder="Usuario" required>
                </div>
                <div class="input-group">
                    <input type="password" id="reg-password" placeholder="Contraseña" required>
                </div>
                <button id="btn-register" class="btn-primary">Registrarse</button>
                <p>¿Ya tienes cuenta? <a href="#" id="show-login">Inicia Sesión</a></p>
            </div>

            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
