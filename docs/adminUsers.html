<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="admin-container" style="padding-top: 1rem;">
        <button onclick="window.location.href='index.html'" class="btn-icon" style="position: absolute; top: 1rem; left: 1rem;"><i class="fas fa-home"></i></button>

        <section class="user-management">
            <div class="create-user-box" style="margin-top: 2rem;">
                <div class="form-row">
                    <input type="text" id="new-username" placeholder="Nombre de usuario">
                    <input type="password" id="new-password" placeholder="Contraseña">
                    <select id="new-role">
                        <option value="User">User</option>
                        <option value="Admin">Admin</option>
                    </select>
                    <button id="btn-create-user" class="btn-primary">Crear</button>
                </div>
            </div>

            <div class="user-list-container">
                <table id="user-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="user-list-body">
                        <!-- Se llenará dinámicamente -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const currentUser = checkAuth();
            if (currentUser.role !== 'Admin') {
                alert('No tienes permisos de administrador');
                window.location.href = 'index.html';
                return;
            }

            loadUsers();

            document.getElementById('btn-create-user').onclick = async () => {
                const username = document.getElementById('new-username').value;
                const password = document.getElementById('new-password').value;
                const role = document.getElementById('new-role').value;

                if (!username || !password) return alert('Campos incompletos');

                const { error } = await window.supabaseClient
                    .from('users')
                    .insert([{ username, password, role }]);

                if (error) {
                    alert('Error al crear usuario: ' + error.message);
                } else {
                    alert('Usuario creado');
                    loadUsers();
                }
            };
        });


        async function loadUsers() {
            const { data, error } = await window.supabaseClient
                .from('users')
                .select('*');

            if (error) return console.error(error);

            const tbody = document.getElementById('user-list-body');
            tbody.innerHTML = '';

            data.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.username}</td>
                    <td>${user.role}</td>
                    <td>
                        <button onclick="window.location.href='adminAudios.html?userId=${user.id}'" class="btn-primary" style="width: auto; padding: 5px 10px; display: inline-block; margin-right: 5px;">Música</button>
                        <button onclick="deleteUser(${user.id})" class="btn-delete">Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteUser(id) {
            if (!confirm('¿Seguro que quieres eliminar este usuario?')) return;
            const { error } = await window.supabaseClient
                .from('users')
                .delete()
                .eq('id', id);

            if (error) alert(error.message);
            else loadUsers();
        }
    </script>
</body>
</html>
