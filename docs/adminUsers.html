<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="hub-layout">
    <header class="top-nav">
        <div class="nav-brand">
             <button onclick="window.location.href='index.html'" class="circle-btn" style="margin-right: 1rem;"><i class="fas fa-home"></i></button>
             <h1 class="brand-name" id="admin-user-title"></h1>
        </div>
    </header>

    <div class="admin-hub-container">
        <section class="hub-primary">
            <div class="collections-card" style="margin-bottom: 3rem; max-width: 100%;">
                <div class="card-header">
                    <h4>Registrar Nuevo Usuario</h4>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 1rem;">
                    <div class="hub-input" style="margin: 0;">
                        <input type="text" id="new-username" placeholder="Usuario">
                    </div>
                    <div class="hub-input" style="margin: 0;">
                        <input type="password" id="new-password" placeholder="Password">
                    </div>
                    <div class="hub-input" style="margin: 0;">
                        <select id="new-role">
                            <option value="User">User</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                    <button id="btn-create-user" class="hub-btn primary">Añadir</button>
                </div>
            </div>

            <div id="user-list" class="admin-grid">
                <!-- Dinámico -->
            </div>
        </section>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const currentUser = checkAuth();
            if (currentUser.role !== 'Admin') {
                window.location.href = 'index.html';
                return;
            }
            document.getElementById('admin-user-title').textContent = currentUser.username;

            loadUsers();

            document.getElementById('btn-create-user').onclick = async () => {
                const username = document.getElementById('new-username').value;
                const password = document.getElementById('new-password').value;
                const role = document.getElementById('new-role').value;

                if (!username || !password) return alert('Campos obligatorios');

                const { error } = await window.supabaseClient.from('users').insert([{ username, password, role }]);
                if (error) alert("Error en Supabase: " + error.message + "\n\nRevisa el archivo SETUP_GUIDE.md para configurar las políticas RLS.");
                else {
                    document.getElementById('new-username').value = '';
                    document.getElementById('new-password').value = '';
                    loadUsers();
                }
            };
        });

        async function loadUsers() {
            const { data, error } = await window.supabaseClient.from('users').select('*').order('id', { ascending: true });
            if (error) return;

            const container = document.getElementById('user-list');
            container.innerHTML = '';

            data.forEach(user => {
                const card = document.createElement('div');
                card.className = 'admin-user-card';
                card.innerHTML = `
                    <div>
                        <h3 style="font-size: 1.5rem; margin-bottom: 0.5rem;">${user.username}</h3>
                        <p style="color: var(--hub-text-muted);">${user.role} • ID: ${user.id}</p>
                    </div>
                    <div style="display: flex; gap: 1rem;">
                        <button onclick="window.location.href='adminAudios.html?userId=${user.id}'" class="hub-btn secondary" style="flex: 2;">Gestionar Música</button>
                        <button onclick="deleteUser(${user.id})" class="logout-pill" style="width: 48px; height: 48px;"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function deleteUser(id) {
            if (!confirm('Eliminar usuario?')) return;
            await window.supabaseClient.from('users').delete().eq('id', id);
            loadUsers();
        }
    </script>
</body>
</html>
