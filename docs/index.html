<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>
    <div class="app-container">
        <button id="menu-toggle" class="menu-toggle"><i class="fas fa-bars"></i></button>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="logo-text" id="user-display-title"></h1>
                <button id="btn-admin-link" class="btn-icon" style="display: none;" title="Admin Panel"><i class="fas fa-cog"></i></button>
            </div>

            <nav class="playlists-section">
                <div class="section-header">
                    <h3>Biblioteca</h3>
                    <button id="add-playlist" class="btn-icon" title="Crear Playlist"><i class="fas fa-plus"></i></button>
                </div>
                <ul id="playlist-list">
                    <!-- Dinámico -->
                </ul>
            </nav>

            <div class="user-info-bottom">
                <span id="display-username" style="font-weight: 600; color: var(--text-main);"></span>
                <button onclick="logout()" class="btn-icon" title="Cerrar Sesión"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <div class="search-bar">
                    <i class="fas fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="text" id="search-input" placeholder="Buscar música...">
                </div>
                <div class="view-info">
                    <span id="current-view-title" style="font-weight: 600; color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;"></span>
                </div>
            </header>

            <div class="song-list-container">
                <ul id="song-list-ui" class="song-list">
                    <!-- Dinámico -->
                </ul>
            </div>
        </main>

        <footer class="player-bar">
            <div class="now-playing">
                <img src="https://via.placeholder.com/64" alt="Cover" id="player-cover" class="player-cover">
                <div class="track-info">
                    <h4 id="player-title">--</h4>
                    <p id="player-artist">--</p>
                </div>
            </div>

            <div class="player-controls">
                <div class="buttons">
                    <button id="shuffle-btn" class="btn-icon" title="Aleatorio"><i class="fas fa-random"></i></button>
                    <button id="prev-btn" class="btn-icon"><i class="fas fa-step-backward"></i></button>
                    <button id="play-pause-btn" class="btn-play"><i class="fas fa-play"></i></button>
                    <button id="next-btn" class="btn-icon"><i class="fas fa-step-forward"></i></button>
                    <button id="repeat-btn" class="btn-icon" title="Repetir"><i class="fas fa-redo"></i></button>
                </div>
                <div class="progress-container">
                    <span id="current-time">0:00</span>
                    <input type="range" id="progress-bar" value="0" min="0" max="100">
                    <span id="total-duration">0:00</span>
                </div>
            </div>

            <div class="player-options">
                <div class="volume-control">
                    <i class="fas fa-volume-up" id="volume-icon" style="color: var(--text-muted);"></i>
                    <input type="range" id="volume-bar" value="80" min="0" max="100">
                </div>
            </div>
        </footer>
    </div>

    <!-- Modals -->
    <div id="playlist-modal" class="modal">
        <div class="modal-content">
            <h3>Nueva Playlist</h3>
            <div class="input-group">
                <input type="text" id="playlist-name-input" placeholder="Nombre de la playlist">
            </div>
            <div class="modal-buttons">
                <button id="cancel-playlist" class="btn-secondary">Cancelar</button>
                <button id="save-playlist" class="btn-primary">Crear</button>
            </div>
        </div>
    </div>

    <div id="add-to-playlist-modal" class="modal">
        <div class="modal-content">
            <h3>Añadir a Playlist</h3>
            <div class="input-group">
                <select id="playlist-select" class="playlist-select" style="width: 100%; padding: 0.8rem; border-radius: 12px; border: 1px solid var(--border-color); font-family: inherit;">
                    <!-- Dinámico -->
                </select>
            </div>
            <div class="modal-buttons">
                <button id="cancel-add-song" class="btn-secondary">Cancelar</button>
                <button id="confirm-add-song" class="btn-primary">Añadir</button>
            </div>
        </div>
    </div>

    <audio id="main-audio"></audio>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/player.js"></script>
    <script src="js/playlists.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = checkAuth();
            document.getElementById('display-username').textContent = user.username;
            document.getElementById('user-display-title').textContent = user.username;
            if (user.role === 'Admin') {
                const adminBtn = document.getElementById('btn-admin-link');
                adminBtn.style.display = 'block';
                adminBtn.onclick = () => window.location.href = 'adminUsers.html';
            }

            // Mobile menu toggle
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            menuToggle.onclick = () => {
                sidebar.classList.toggle('open');
            };

            // Close sidebar on item click for mobile
            if (window.innerWidth <= 768) {
                document.getElementById('playlist-list').addEventListener('click', () => {
                    sidebar.classList.remove('open');
                });
            }
        });
    </script>
</body>
</html>
