<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body class="hub-layout">

    <header class="top-nav">
        <div class="nav-brand">
            <h1 id="user-display-title" class="brand-name" style="text-transform: capitalize;"></h1>
        </div>

        <div class="nav-search-container">
            <div class="nav-search">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="Explora tu música...">
                </div>
            </div>

            <div class="nav-actions">
                <button id="btn-admin-link" class="nav-btn" style="display: none;">Admin</button>
                <div class="user-pill">
                    <span id="display-username"></span>
                    <button onclick="logout()" class="logout-pill" title="Salir"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </div>
    </header>

    <button id="mobile-playlist-toggle" class="mobile-drawer-tab"><i class="fas fa-list"></i></button>

    <div class="main-hub">
        <aside class="hub-secondary" id="mobile-drawer">
            <div class="collections-card">
                <div class="card-header">
                    <h4>Playlists</h4>
                    <button id="add-playlist" class="circle-btn"><i class="fas fa-plus"></i></button>
                </div>
                <ul id="playlist-list" class="hub-playlist-links">
                    <!-- Dinámico -->
                </ul>
                <button id="close-drawer" class="hub-btn secondary mobile-only" style="margin-top: 1rem; width: 100%;">Cerrar</button>
            </div>
        </aside>

        <main class="hub-primary">
            <div class="hub-header">
                <h2 id="current-view-title">Biblioteca Global</h2>
                <div style="display: flex; gap: 0.5rem; align-items: center; margin-left: 1rem;">
                    <button id="btn-open-multi-add" class="circle-btn" title="Añadir canciones" style="display: none;"><i class="fas fa-plus"></i></button>
                    <button id="toggle-sort-btn" class="circle-btn" title="Activar Ordenar"><i class="fas fa-sort"></i></button>
                </div>
            </div>

            <div class="song-grid-container">
                <div id="song-list-ui" class="mosaic-grid">
                    <!-- Dinámico -->
                </div>
            </div>
        </main>
    </div>

    <!-- Player Bar -->
    <div id="player-bar" class="bottom-player-bar">
        <div class="player-left">
            <div id="player-cover-container" class="player-mini-cover default-art" style="width: 64px; height: 64px; font-size: 1.5rem;">
                <i class="fas fa-music"></i>
            </div>
            <img src="" alt="" id="player-cover" class="player-mini-cover" style="display: none;">
            <div class="player-info">
                <h4 id="player-title">Selecciona una canción</h4>
                <p id="player-artist">--</p>
            </div>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <button id="shuffle-btn" class="ctrl-btn" title="Aleatorio"><i class="fas fa-random"></i></button>
                <button id="prev-btn" class="ctrl-btn" title="Anterior"><i class="fas fa-step-backward"></i></button>
                <button id="play-pause-btn" class="play-main-btn"><i class="fas fa-play"></i></button>
                <button id="next-btn" class="ctrl-btn" title="Siguiente"><i class="fas fa-step-forward"></i></button>
                <button id="repeat-btn" class="ctrl-btn" title="Repetir"><i class="fas fa-redo"></i></button>
            </div>
            <div class="player-progress-container">
                <span id="current-time" class="time-label">0:00</span>
                <input type="range" id="progress-bar" class="player-progress" value="0" min="0" max="100">
                <span id="total-duration" class="time-label">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <div class="volume-container">
                <i class="fas fa-volume-up" id="volume-icon"></i>
                <input type="range" id="volume-bar" class="volume-slider" value="80" min="0" max="100">
            </div>
        </div>
    </div>

    <div id="multi-add-modal" class="modal">
        <div class="modal-card" style="width: 80%; max-width: 800px; max-height: 85vh; overflow-y: auto;">
            <h3 id="multi-add-title">Añadir a Playlist</h3>
            <p style="margin-bottom: 1rem;">Selecciona las canciones que deseas añadir:</p>

            <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; justify-content: center;">
                <button id="btn-multi-select-all" class="nav-btn" style="font-size: 0.8rem; padding: 0.5rem 1rem;">Seleccionar Todas</button>
                <button id="btn-multi-deselect-all" class="nav-btn" style="font-size: 0.8rem; padding: 0.5rem 1rem; background: var(--hub-surface-light);">Deseleccionar Todas</button>
            </div>

            <div id="multi-add-list" class="mosaic-grid" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); text-align: left; margin-bottom: 2rem;">
                <!-- Dinámico -->
            </div>
            <div class="hub-modal-actions">
                <button id="btn-multi-cancel" class="hub-btn secondary">Cancelar</button>
                <button id="btn-multi-confirm" class="hub-btn primary">Añadir Seleccionadas</button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="playlist-modal" class="modal">
        <div class="modal-card">
            <h3>Nueva Colección</h3>
            <div class="hub-input">
                <input type="text" id="playlist-name-input" placeholder="Título de la playlist">
            </div>
            <div class="hub-modal-actions">
                <button id="cancel-playlist" class="hub-btn secondary">Cancelar</button>
                <button id="save-playlist" class="hub-btn primary">Crear</button>
            </div>
        </div>
    </div>

    <div id="add-to-playlist-modal" class="modal">
        <div class="modal-card">
            <h3>Organizar Música</h3>
            <p>Elige una de tus colecciones:</p>
            <div class="hub-input">
                <select id="playlist-select">
                    <!-- Dinámico -->
                </select>
            </div>
            <div class="hub-modal-actions">
                <button id="cancel-add-song" class="hub-btn secondary">Volver</button>
                <button id="confirm-add-song" class="hub-btn primary">Añadir</button>
            </div>
        </div>
    </div>

    <audio id="main-audio"></audio>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/player.js"></script>
    <script src="js/playlists.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = checkAuth();
            document.getElementById('display-username').textContent = user.username;
            document.getElementById('user-display-title').textContent = user.username;
            if (user.role === 'Admin') {
                const adminBtn = document.getElementById('btn-admin-link');
                adminBtn.style.display = 'inline-flex';
                adminBtn.onclick = () => window.location.href = 'adminUsers.html';
            }

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('sw.js').then(reg => {
                        console.log('SW registered:', reg);
                    }).catch(err => {
                        console.log('SW registration failed:', err);
                    });
                });

                let refreshing;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (refreshing) return;
                    refreshing = true;
                    window.location.reload();
                });
            }
        });
    </script>
</body>
</html>
