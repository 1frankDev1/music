<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body class="hub-layout">

    <header class="top-nav">
        <div class="nav-brand">
            <h1 id="user-display-title" class="brand-name" style="text-transform: capitalize;"></h1>
        </div>

        <div class="nav-search">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Explora tu música...">
            </div>
        </div>

        <div class="nav-actions">
            <button id="btn-admin-link" class="nav-btn" style="display: none;"><i class="fas fa-user-shield"></i> Admin</button>
            <div class="user-pill">
                <span id="display-username"></span>
                <button onclick="logout()" class="logout-pill" title="Salir"><i class="fas fa-power-off"></i></button>
            </div>
        </div>
    </header>

    <div class="main-hub">
        <aside class="hub-secondary">
            <div class="collections-card">
                <div class="card-header">
                    <h4>Playlists</h4>
                    <button id="add-playlist" class="circle-btn"><i class="fas fa-plus"></i></button>
                </div>
                <ul id="playlist-list" class="hub-playlist-links">
                    <!-- Dinámico -->
                </ul>
            </div>
        </aside>

        <main class="hub-primary">
            <div class="hub-header">
                <h2 id="current-view-title">Explorar Todo</h2>
            </div>

            <div class="song-grid-container">
                <div id="song-list-ui" class="mosaic-grid">
                    <!-- Dinámico -->
                </div>
            </div>
        </main>
    </div>

    <!-- Floating Player -->
    <div id="floating-player" class="player-pod">
        <div class="pod-artwork">
            <img src="https://via.placeholder.com/150" alt="Cover" id="player-cover">
            <div class="pod-overlay">
                 <button id="play-pause-btn" class="pod-play-btn"><i class="fas fa-play"></i></button>
            </div>
        </div>
        <div class="pod-details">
            <div class="pod-info">
                <h4 id="player-title">Selecciona una canción</h4>
                <p id="player-artist">--</p>
            </div>
            <div class="pod-controls">
                <button id="shuffle-btn" class="ctrl-btn"><i class="fas fa-random"></i></button>
                <button id="prev-btn" class="ctrl-btn"><i class="fas fa-step-backward"></i></button>
                <button id="next-btn" class="ctrl-btn"><i class="fas fa-step-forward"></i></button>
                <button id="repeat-btn" class="ctrl-btn"><i class="fas fa-redo"></i></button>
            </div>
            <div class="pod-progress">
                <span id="current-time">0:00</span>
                <input type="range" id="progress-bar" value="0" min="0" max="100">
                <span id="total-duration">0:00</span>
            </div>
            <div class="pod-volume">
                <i class="fas fa-volume-down"></i>
                <input type="range" id="volume-bar" value="80" min="0" max="100">
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="playlist-modal" class="modal">
        <div class="modal-card">
            <h3>Nueva Colección</h3>
            <div class="hub-input">
                <input type="text" id="playlist-name-input" placeholder="Título de la playlist">
            </div>
            <div class="hub-modal-actions">
                <button id="cancel-playlist" class="hub-btn secondary">Cancelar</button>
                <button id="save-playlist" class="hub-btn primary">Crear</button>
            </div>
        </div>
    </div>

    <div id="add-to-playlist-modal" class="modal">
        <div class="modal-card">
            <h3>Organizar Música</h3>
            <p>Elige una de tus colecciones:</p>
            <div class="hub-input">
                <select id="playlist-select">
                    <!-- Dinámico -->
                </select>
            </div>
            <div class="hub-modal-actions">
                <button id="cancel-add-song" class="hub-btn secondary">Volver</button>
                <button id="confirm-add-song" class="hub-btn primary">Añadir</button>
            </div>
        </div>
    </div>

    <audio id="main-audio"></audio>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/player.js"></script>
    <script src="js/playlists.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = checkAuth();
            document.getElementById('display-username').textContent = user.username;
            document.getElementById('user-display-title').textContent = user.username;
            if (user.role === 'Admin') {
                const adminBtn = document.getElementById('btn-admin-link');
                adminBtn.style.display = 'inline-flex';
                adminBtn.onclick = () => window.location.href = 'adminUsers.html';
            }
        });
    </script>
</body>
</html>
