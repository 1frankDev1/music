<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Music Player</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar para Playlists -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2 class="logo-text">Pastel<span>Music</span></h2>
                <button id="btn-admin-link" class="btn-admin" style="display: none;">Admin</button>
            </div>

            <div class="playlists-section">
                <div class="section-header">
                    <h3>Tus Playlists</h3>
                    <button id="add-playlist" title="Crear Playlist"><i class="fas fa-plus"></i></button>
                </div>
                <ul id="playlist-list">
                    <!-- Dinámico -->
                </ul>
            </div>

            <div class="user-info-bottom">
                <span id="display-username"></span>
                <button onclick="logout()" class="btn-icon" title="Cerrar Sesión"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1 id="current-view-title">Todas las Canciones</h1>
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Buscar música...">
                </div>
            </header>

            <div class="song-list-container">
                <ul id="song-list-ui" class="song-list">
                    <!-- Dinámico -->
                </ul>
            </div>
        </main>

        <!-- Player Bar -->
        <footer class="player-bar">
            <div class="now-playing">
                <img src="https://via.placeholder.com/60" alt="Cover" id="player-cover" class="player-cover">
                <div class="track-info">
                    <h4 id="player-title">Título</h4>
                    <p id="player-artist">Artista</p>
                </div>
            </div>

            <div class="player-controls">
                <div class="buttons">
                    <button id="shuffle-btn" class="btn-icon" title="Aleatorio"><i class="fas fa-random"></i></button>
                    <button id="prev-btn" class="btn-icon"><i class="fas fa-step-backward"></i></button>
                    <button id="play-pause-btn" class="btn-play"><i class="fas fa-play"></i></button>
                    <button id="next-btn" class="btn-icon"><i class="fas fa-step-forward"></i></button>
                    <button id="repeat-btn" class="btn-icon" title="Repetir"><i class="fas fa-redo"></i></button>
                </div>
                <div class="progress-container">
                    <span id="current-time">0:00</span>
                    <input type="range" id="progress-bar" value="0" min="0" max="100">
                    <span id="total-duration">0:00</span>
                </div>
            </div>

            <div class="player-options">
                <div class="volume-control">
                    <i class="fas fa-volume-up" id="volume-icon"></i>
                    <input type="range" id="volume-bar" value="80" min="0" max="100">
                </div>
            </div>
        </footer>
    </div>

    <!-- Modals -->
    <div id="playlist-modal" class="modal">
        <div class="modal-content">
            <h3>Nueva Playlist</h3>
            <input type="text" id="playlist-name-input" placeholder="Nombre de la playlist">
            <div class="modal-buttons">
                <button id="cancel-playlist" class="btn-secondary">Cancelar</button>
                <button id="save-playlist" class="btn-primary">Crear</button>
            </div>
        </div>
    </div>

    <audio id="main-audio"></audio>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/player.js"></script>
    <script src="js/playlists.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = checkAuth();
            document.getElementById('display-username').textContent = user.username;
            if (user.role === 'Admin') {
                const adminBtn = document.getElementById('btn-admin-link');
                adminBtn.style.display = 'block';
                adminBtn.onclick = () => window.location.href = 'adminUsers.html';
            }
        });
    </script>
</body>
</html>
